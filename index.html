<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RhinoReport — Congressional Loyalty Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #C8102E;
      --red-dark: #8B0000;
      --red-light: #FF3352;
      --blue: #0A3161;
      --blue-light: #1a5fa8;
      --gold: #FFD700;
      --gold-dim: #b8960c;
      --bg: #0a0a0c;
      --bg2: #111116;
      --bg3: #1a1a22;
      --border: #2a2a35;
      --text: #f0f0f0;
      --text-dim: #888;
      --text-muted: #555;
      --green: #22c55e;
      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }

    #root { min-height: 100vh; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* HEADER */
    .site-header {
      background: linear-gradient(135deg, #0d0d12 0%, #13090f 50%, #0d0d12 100%);
      border-bottom: 2px solid var(--red-dark);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 24px rgba(200,16,46,0.18);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
    }
    .logo-block { display: flex; align-items: baseline; gap: 10px; }
    .logo-r {
      font-family: var(--font-head);
      font-size: 52px;
      color: var(--red);
      line-height: 1;
      text-shadow: 0 0 20px rgba(200,16,46,0.5);
    }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title {
      font-family: var(--font-head);
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--text);
    }
    .logo-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header-stats {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .hstat {
      text-align: center;
    }
    .hstat-val {
      font-family: var(--font-head);
      font-size: 28px;
      line-height: 1;
    }
    .hstat-val.red { color: var(--red-light); }
    .hstat-val.blue { color: #4d8fd4; }
    .hstat-val.gold { color: var(--gold); }
    .hstat-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header-divider { width: 1px; height: 36px; background: var(--border); }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--green);
      letter-spacing: 1px;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

    /* STRIPE SUPPORT BAR */
    .support-bar {
      background: linear-gradient(90deg, rgba(200,16,46,0.08) 0%, rgba(200,16,46,0.04) 100%);
      border-bottom: 1px solid rgba(200,16,46,0.15);
      padding: 6px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .support-bar-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .support-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
      cursor: pointer;
    }
    .support-btn.monthly {
      background: rgba(200,16,46,0.15);
      border: 1px solid rgba(200,16,46,0.4);
      color: #ff6680;
    }
    .support-btn.monthly:hover { background: rgba(200,16,46,0.28); border-color: var(--red); }
    .support-btn.onetime {
      background: rgba(255,215,0,0.08);
      border: 1px solid rgba(255,215,0,0.25);
      color: var(--gold);
    }
    .support-btn.onetime:hover { background: rgba(255,215,0,0.15); border-color: var(--gold); }

    /* STAT BOXES */
    .stat-row {
      max-width: 1400px;
      margin: 20px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .stat-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-box.red::before { background: var(--red); }
    .stat-box.gold::before { background: var(--gold); }
    .stat-box.green::before { background: var(--green); }
    .stat-box.blue::before { background: #4d8fd4; }
    .stat-box-val {
      font-family: var(--font-head);
      font-size: 38px;
      line-height: 1;
    }
    .stat-box.red .stat-box-val { color: var(--red-light); }
    .stat-box.gold .stat-box-val { color: var(--gold); }
    .stat-box.green .stat-box-val { color: var(--green); }
    .stat-box.blue .stat-box-val { color: #4d8fd4; }
    .stat-box-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* TABS */
    .tabs-wrap {
      max-width: 1400px;
      margin: 20px auto 0;
      padding: 0 24px;
    }
    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      background: none;
      border: none;
      padding: 10px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text-dim); }
    .tab.active { color: var(--text); border-bottom-color: var(--red); }

    /* MAIN CONTENT */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-search {
      flex: 1;
      min-width: 200px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .filter-search:focus { border-color: var(--red-dark); }
    .filter-select {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .filter-select:focus { border-color: var(--red-dark); }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 16px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--red); color: var(--text); }
    .filter-btn.active { background: rgba(200,16,46,0.1); }

    /* MEMBER GRID */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* MEMBER CARD */
    .member-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .member-card:hover {
      border-color: #3a3a4a;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .member-card.r { border-left: 3px solid var(--red-dark); }
    .member-card.d { border-left: 3px solid var(--blue-light); }
    .member-card.live-scored { background: linear-gradient(135deg, #13131a, #0f1318); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .card-name {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }
    .card-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .card-score-wrap { text-align: right; }
    .card-score {
      font-family: var(--font-head);
      font-size: 32px;
      line-height: 1;
    }
    .card-score.high { color: var(--red-light); }
    .card-score.mid { color: var(--gold); }
    .card-score.low { color: #4d8fd4; }
    .card-score-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .score-bar-bg {
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      margin: 10px 0 8px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-party-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 500;
    }
    .badge-r { background: rgba(200,16,46,0.15); color: #ff6680; border: 1px solid rgba(200,16,46,0.3); }
    .badge-d { background: rgba(26,95,168,0.15); color: #4d8fd4; border: 1px solid rgba(26,95,168,0.3); }
    .badge-i { background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid rgba(255,215,0,0.25); }
    .live-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-tag-dot { width: 5px; height: 5px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }

    /* LOADING */
    .loading-wrap {
      text-align: center;
      padding: 80px 24px;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* CONTACT MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .modal-title {
      font-family: var(--font-head);
      font-size: 24px;
      letter-spacing: 1px;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s;
    }
    .modal-close:hover { border-color: var(--red); color: var(--text); }
    .modal-section { margin-bottom: 20px; }
    .modal-section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.15s;
    }
    .contact-link:hover { border-color: var(--text-dim); color: var(--text); }
    .ai-draft-section { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .issue-select-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
    .issue-select {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }
    .draft-btn {
      background: var(--red-dark);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      color: white;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .draft-btn:hover { background: var(--red); }
    .draft-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .draft-output {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
      white-space: pre-wrap;
      min-height: 80px;
    }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--green); color: var(--green); }

    /* MY REPS TAB */
    .zip-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      max-width: 400px;
    }
    .zip-input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      outline: none;
      letter-spacing: 2px;
    }
    .zip-input:focus { border-color: var(--red-dark); }
    .zip-btn {
      background: var(--red-dark);
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      color: white;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .zip-btn:hover { background: var(--red); }

    /* ANALYSIS TAB */
    .intel-wrap {
      max-width: 800px;
    }
    .intel-btn {
      background: linear-gradient(135deg, var(--red-dark), #6b0010);
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      color: white;
      font-family: var(--font-mono);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: opacity 0.15s;
    }
    .intel-btn:hover { opacity: 0.88; }
    .intel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .intel-output {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-dim);
      white-space: pre-wrap;
    }

    /* HEROES / HALF-ASSES */
    .ranked-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 700px;
    }
    .ranked-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ranked-item:hover { border-color: #3a3a4a; }
    .rank-num {
      font-family: var(--font-head);
      font-size: 22px;
      color: var(--text-muted);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }
    .rank-num.top3 { color: var(--gold); }
    .rank-info { flex: 1; }
    .rank-name { font-weight: 700; font-size: 14px; }
    .rank-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .rank-score {
      font-family: var(--font-head);
      font-size: 28px;
    }
    .rank-score.high { color: var(--red-light); }
    .rank-score.low { color: #4d8fd4; }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
    }

    /* SECTION TITLE */
    .section-title {
      font-family: var(--font-head);
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .section-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .header-stats { display: none; }
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .member-grid { grid-template-columns: 1fr; }
      .logo-r { font-size: 40px; }
      .logo-title { font-size: 18px; }
    }
    @media (max-width: 480px) {
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const FUNCTION_URL = "/.netlify/functions/congress";

const STRIPE_MONTHLY = "https://buy.stripe.com/7sYbJ2gEV7sC9RDcBNfEk01";
const STRIPE_ONETIME = "https://buy.stripe.com/00wfZi74l00agg145hfEk00";

const ISSUES = [
  "Immigration & Border Security",
  "Government Spending & Debt",
  "Second Amendment",
  "Energy & Fossil Fuels",
  "Election Integrity",
  "Foreign Aid",
  "China Policy",
  "Crime & Law Enforcement",
  "Healthcare Policy",
  "Trade & Tariffs",
];

const STATE_MAP = {
  AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",
  CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",
  IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",
  ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",
  MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",
  NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",
  ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",
  RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",
  TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",
  WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"D.C.",PR:"Puerto Rico",
  GU:"Guam",VI:"Virgin Islands",MP:"N. Mariana Islands",AS:"American Samoa",
};

function scoreColor(s) {
  if (s >= 70) return "high";
  if (s >= 40) return "mid";
  return "low";
}

function barColor(s, party) {
  if (party === "R") return `hsl(${350 - s * 1.5}, 70%, 45%)`;
  return "#1a5fa8";
}

async function callClaude(prompt) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await resp.json();
  return data.content?.map(b => b.text || "").join("") || "No response.";
}

function TrackerTab({ members, onSelect }) {
  const [search, setSearch] = useState("");
  const [partyFilter, setPartyFilter] = useState("ALL");
  const [chamberFilter, setChamberFilter] = useState("ALL");
  const [sortBy, setSortBy] = useState("score");

  const filtered = members
    .filter(m => {
      if (partyFilter !== "ALL" && m.party !== partyFilter) return false;
      if (chamberFilter !== "ALL" && m.chamber !== chamberFilter) return false;
      if (search) {
        const q = search.toLowerCase();
        return (m.name || "").toLowerCase().includes(q) ||
               (m.state || "").toLowerCase().includes(q) ||
               (STATE_MAP[m.state] || "").toLowerCase().includes(q);
      }
      return true;
    })
    .sort((a, b) => {
      if (sortBy === "score") return (b.alignment ?? 0) - (a.alignment ?? 0);
      if (sortBy === "score-asc") return (a.alignment ?? 0) - (b.alignment ?? 0);
      if (sortBy === "name") return (a.name || "").localeCompare(b.name || "");
      return 0;
    });

  return (
    <div>
      <div className="filters">
        <input
          className="filter-search"
          placeholder="Search by name or state…"
          value={search}
          onChange={e => setSearch(e.target.value)}

          <option value="ALL">All Parties</option>
          <option value="R">Republican</option>
          <option value="D">Democrat</option>
          <option value="ID">Independent</option>
        </select>
        <select className="filter-select" value={chamberFilter} onChange={e => setChamberFilter(e.target.value)}>
          <option value="ALL">Both Chambers</option>
          <option value="House">House</option>
          <option value="Senate">Senate</option>
        </select>
        <select className="filter-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
          <option value="score">Highest Score</option>
          <option value="score-asc">Lowest Score</option>
          <option value="name">Name A–Z</option>

function MyRepsTab({ members, onSelect }) {
  const [zip, setZip] = useState("");

  const [reps, setReps] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const lookup = async () => {
    if (zip.length !== 5) { setError("Enter a 5-digit ZIP code."); return; }
    setLoading(true);
    setError("");
    setReps([]);
    try {
      const resp = await fetch(`https://api.zippopotam.us/us/${zip}`);
      if (!resp.ok) throw new Error("ZIP not found.");
      const data = await resp.json();
      const st = data.places?.[0]?.["state abbreviation"] || "";
      setState(st);
      const found = members.filter(m => m.state === st);
      setReps(found);
      if (found.length === 0) setError(`No members found for state ${st}.`);
    } catch (e) {
      setError(e.message || "Lookup failed.");
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="section-title">MY REPS</div>
      <div className="section-sub">Find your congressional representatives by ZIP code</div>
      <div className="zip-wrap">
        <input
          className="zip-input"
          placeholder="12345"
          maxLength={5}
          value={zip}
          onChange={e => setZip(e.target.value.replace(/\D/g,""))}
          onKeyDown={e => e.key === "Enter" && lookup()}

}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadStatus, setLoadStatus] = useState("Initializing…");
  const [tab, setTab] = useState("tracker");
  const [selectedMember, setSelectedMember] = useState(null);
  const [scoreStatus, setScoreStatus] = useState("");

  // Fetch all members from Congress.gov via Netlify proxy
  const loadMembers = async () => {
    setLoadStatus("Loading House members…");
    let all = [];

    try {
      // House
      const houseResp = await fetch(`${FUNCTION_URL}?path=member&congress=119&chamber=house&limit=435&offset=0`);
      const houseData = await houseResp.json();
      const houseMembers = (houseData.members || []).map(m => ({
        ...m,
        chamber: "House",
        alignment: m.partyName === "Republican" || m.party === "R" ? 72 : 8,
        party: normalizeParty(m),
        bioguideId: m.bioguideId || m.bioguideID,
        liveScored: false,
      }));
      all = all.concat(houseMembers);
    } catch(e) {
      console.error("House load error:", e);
    }

    setLoadStatus("Loading Senate members…");
    try {
      // Senate
      const senResp = await fetch(`${FUNCTION_URL}?path=member&congress=119&chamber=senate&limit=100&offset=0`);
      const senData = await senResp.json();
      const senMembers = (senData.members || []).map(m => ({
        ...m,
        chamber: "Senate",
        alignment: m.partyName === "Republican" || m.party === "R" ? 72 : 8,
        party: normalizeParty(m),
        bioguideId: m.bioguideId || m.bioguideID,
        liveScored: false,
      }));
      all = all.concat(senMembers);
    } catch(e) {
      console.error("Senate load error:", e);
    }

    // Deduplicate by bioguideId
    const seen = new Set();
    const deduped = all.filter(m => {
      if (!m.bioguideId) return true;
      if (seen.has(m.bioguideId)) return false;
      seen.add(m.bioguideId);
      return true;
    });

    setLoadStatus(`Loaded ${deduped.length} members`);
    setMembers(deduped);
    setLoading(false);
    return deduped;
  };

  function normalizeParty(m) {
    const p = (m.party || m.partyName || "").toUpperCase();
    if (p.startsWith("R")) return "R";
    if (p.startsWith("D")) return "D";
    return "ID";
  }

  // Background scoring: fetch vote data and update alignment
  const backgroundScore = async (membersList) => {
    setScoreStatus("Fetching live vote data…");
    try {
      const resp = await fetch(`${FUNCTION_URL}/house-vote/119/2/74/members`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();

      // Vote data may be nested under various keys
      const voteMembers = data.members || data.voteMembers || data.votes || [];

      if (voteMembers.length === 0) {
        setScoreStatus("No vote data returned.");
        return;
      }

      setScoreStatus(`Scoring ${voteMembers.length} votes…`);

      setMembers(prev => {
        const updated = prev.map(m => {
          // Case-insensitive match on bioguideId / bioguideID
          const match = voteMembers.find(v => {
            const vId = v.bioguideId || v.bioguideID || v.bioguide_id || "";
            const mId = m.bioguideId || "";
            return vId.toLowerCase() === mId.toLowerCase();
          });

          if (!match) return m;
          if (m.party !== "R") return m; // only score Republicans

          const vote = (match.voteCast || match.votePosition || match.vote || "").toUpperCase();
          let delta = 0;
          if (vote === "YEA" || vote === "YES" || vote === "AYE") delta = 5;
          else if (vote === "NAY" || vote === "NO") delta = -8;
          else if (vote === "NOT VOTING" || vote === "ABSENT") delta = -2;

          const newScore = Math.max(0, Math.min(100, (m.alignment ?? 72) + delta));
          return { ...m, alignment: newScore, liveScored: true };
        });
        return updated;
      });

      setScoreStatus("Live scores applied ✓");
    } catch(e) {
      console.error("backgroundScore error:", e);
      setScoreStatus("Live scoring unavailable");
    }
  };

  useEffect(() => {
    loadMembers().then(membersList => {
      if (membersList.length > 0) {
        backgroundScore(membersList);
      }
    });
  }, []);

  // Derived stats
  const republicans = members.filter(m => m.party === "R");
  const gopAvg = republicans.length
    ? Math.round(republicans.reduce((a, m) => a + (m.alignment ?? 72), 0) / republicans.length)
    : 0;
  const liveCount = members.filter(m => m.liveScored).length;
  const heroes = republicans.filter(m => (m.alignment ?? 0) >= 80).length;
  const halfasses = republicans.filter(m => (m.alignment ?? 100) < 50).length;

  const TABS = [
    { id: "tracker", label: "Tracker" },
    { id: "half-asses", label: "Half-Asses (RINOs)" },
    { id: "heroes", label: "Heroes" },
    { id: "my-reps", label: "My Reps" },
    { id: "analysis", label: "AI Analysis" },
  ];

  return (
    <div>
      {/* HEADER */}
      <header className="site-header">
        <div className="header-inner">
          <div className="logo-block">
            <div className="logo-r">R</div>
            <div className="logo-text">
              <div className="logo-title">RHINOREPORT</div>
              <div className="logo-sub">Congressional Loyalty Tracker · 119th Congress</div>
            </div>
          </div>
          <div className="header-stats">
            <div className="hstat">
              <div className="hstat-val red">{members.length}</div>
              <div className="hstat-label">Tracked</div>
            </div>
            <div className="header-divider"></div>
            <div className="hstat">
              <div className="hstat-val gold">{gopAvg}</div>
              <div className="hstat-label">GOP Avg</div>
            </div>
            <div className="header-divider"></div>
            <div className="hstat">
              <div className="hstat-val blue">{liveCount}</div>
              <div className="hstat-label">Live Scored</div>
            </div>
            <div className="header-divider"></div>
            {liveCount > 0
              ? <div className="live-badge"><div className="live-dot"></div>LIVE DATA</div>
              : <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>{scoreStatus}</div>
            }
          </div>
        </div>
      </header>

      {/* SUPPORT BAR */}
      <div className="support-bar">
        <span className="support-bar-text">Keep the tracker running —</span>
        <a href={STRIPE_MONTHLY} target="_blank" rel="noopener noreferrer" className="support-btn monthly">
          ♥ $3/mo
        </a>
        <a href={STRIPE_ONETIME} target="_blank" rel="noopener noreferrer" className="support-btn onetime">
          ★ $5 one-time
        </a>
      </div>

      {loading ? (
        <div className="loading-wrap">
          <div className="loading-spinner"></div>
          <div className="loading-text">{loadStatus}</div>
        </div>
      ) : (
        <>
          {/* STAT BOXES */}
          <div className="stat-row">
            <div className="stat-box red">
              <div className="stat-box-val">{members.length}</div>
              <div className="stat-box-label">Members Tracked</div>
            </div>

                  className={`tab ${tab === t.id ? "active" : ""}`}
                  onClick={() => setTab(t.id)}
                >{t.label}</button>
              ))}
            </div>
          </div>

          {/* TAB CONTENT */}
          <div className="main">
            {tab === "tracker" && <TrackerTab members={members} onSelect={setSelectedMember} />}
            {tab === "half-asses" && <HalfAssesTab members={members} onSelect={setSelectedMember} />}
            {tab === "heroes" && <HeroesTab members={members} onSelect={setSelectedMember} />}
            {tab === "my-reps" && <MyRepsTab members={members} onSelect={setSelectedMember} />}
            {tab === "analysis" && <AnalysisTab members={members} />}
          </div>
        </>
      )}

      {/* CONTACT MODAL */}
      {selectedMember && (
        <ContactModal member={selectedMember} onClose={() => setSelectedMember(null)} />
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
