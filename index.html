const { useState, useCallback, useEffect } = React;

async function callClaude(system, user) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system,
      messages: [{ role: "user", content: user }]
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

function scoreColor(n) {
  if (n >= 80) return "#22c55e";
  if (n >= 60) return "#f4a261";
  if (n >= 40) return "#f97316";
  return "#e63946";
}

function ScoreBadge({ score }) {
  const color = scoreColor(score);
  return (
    <div style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:48, height:48, borderRadius:"50%", border:`2px solid ${color}`, background:`${color}18`, fontWeight:900, fontSize:15, color, fontFamily:"monospace" }}>
      {score}
    </div>
  );
}

async function fetchMembers(congress) {
  const chambers = ["senate", "house"];
  let all = [];
  for (const chamber of chambers) {
    let offset = 0;
    while (true) {
      const url = `${CG_BASE}/member/congress/${congress}/${chamber}?format=json&limit=250&offset=${offset}&api_key=${CG_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const list = data.members || [];
      all = all.concat(list.map(m => ({
        bioguideId: m.bioguideId,
        name: m.name,
        party: m.partyName === "Republican" ? "R" : m.partyName === "Democrat" ? "D" : "I",
        state: m.state || "",
        chamber: chamber === "senate" ? "Senate" : "House",
        alignment: PARTY_BASELINE[m.partyName === "Republican" ? "R" : "D"] || 50,
        votesSampled: 0,
      })));
      if (list.length < 250) break;
      offset += 250;
      await sleep(300);
    }
  }
  return all;
}

async function scoreMembers(members, congress, setProgress) {
  const scored = [];
  for (let i = 0; i < members.length; i++) {
    const m = members[i];
    setProgress(Math.round((i / members.length) * 100));
    try {
      const url = `${CG_BASE}/member/${m.bioguideId}/votes?format=json&limit=20&congress=${congress}&api_key=${CG_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const votes = data.votes || [];
      if (votes.length > 0) {
        const partyVotes = votes.filter(v => v.position && v.position !== "Not Voting");
        const aligned = partyVotes.filter(v => {
          if (m.party === "R") return v.position === "Yea" || v.position === "Yes";
          return v.position === "Nay" || v.position === "No";
        });
        const rawPct = partyVotes.length > 0 ? Math.round((aligned.length / partyVotes.length) * 100) : PARTY_BASELINE[m.party];
        m.alignment = rawPct;
        m.votesSampled = partyVotes.length;
      }
    } catch (_) {}
    scored.push(m);
    await sleep(120);
  }
  return scored;
}

          <>
            <div style={{ background:"#0d1117", border:"1px solid #1e2a3a", borderRadius:12, padding:14, marginBottom:16 }}>
              <div style={{ fontSize:12, color:"#e8eaf0", fontWeight:800, marginBottom:8 }}>📍 FIND MY REPRESENTATIVES</div>
              <p style={{ fontSize:12, color:"#6b7280", marginBottom:12, lineHeight:1.7 }}>Enter your ZIP code to see your senators and representative's RINO scores.</p>
              {scored.length === 0 && <p style={{ fontSize:11, color:"#e63946" }}>Load live data first.</p>}
              <div style={{ display:"flex", gap:8 }}>
                <input value={zipInput} onChange={e => setZipInput(e.target.value.replace(/\D/g,"").slice(0,5))}
                  placeholder="ZIP code" maxLength={5}
                  style={{ flex:1, padding:"8px 12px", borderRadius:8, border:"1px solid #1e2a3a", background:"#080c14", color:"#e8eaf0", fontSize:14, letterSpacing:2, fontFamily:"monospace" }} />
                <button onClick={handleZipLookup} disabled={zipLoading || scored.length === 0}
                  style={{ padding:"8px 16px", borderRadius:8, border:"none", background:"#e63946", color:"#fff", fontWeight:700, fontSize:13, cursor:"pointer" }}>
                  {zipLoading ? "…" : "Find"}
                </button>
              </div>
            </div>
            {myReps.length > 0 && (
              <>
                <div style={{ fontSize:11, color:"#4b5563", marginBottom:10 }}>{myReps.length} representatives found</div>
                {myReps.map(m => <MemberCard key={m.bioguideId} member={m} onDrillDown={setDrillMember} onContact={setContactMember} />)}
              </>
            )}
          </>
        )}

        {/* ANALYSIS VIEW */}
        {!loading && view === "analysis" && (
          <>
            <div style={{ background:"#0d1117", border:"1px solid #1e2a3a", borderRadius:12, padding:16, marginBottom:16 }}>
              <div style={{ fontSize:11, color:"#e63946", fontWeight:700, letterSpacing:1, marginBottom:8 }}>🤖 AI POLITICAL INTEL BRIEF</div>
              <p style={{ fontSize:12, color:"#6b7280", margin:"0 0 14px", lineHeight:1.7 }}>{scored.length === 0 ? "Load live data first." : `Using data from ${scored.length} scored members.`}</p>
              <button onClick={async () => {
                setAiLoading(true); setAiAnalysis("");
                try {
                  const t5o = halfasses.slice(0, 5).map(m => `${m.name} (${m.alignment}%)`).join(", ");
                  const t5c = heroes.slice(0, 5).map(m => `${m.name} (${m.alignment}%)`).join(", ");
                  const text = await callClaude(
                    "Sharp conservative analyst. Punchy and direct.",
                    `${congress}th Congress: ${members.length} members, ${scored.length} scored, GOP avg ${repAvg}%.\nHeroes: ${t5c}\nHalf-Asses: ${t5o}\n\n3-paragraph intel brief: 1) caucus loyalty, 2) biggest RINOs and why they matter, 3) tactical recs.`
                  );
                  setAiAnalysis(text);
                } catch { setAiAnalysis("AI unavailable."); }
                setAiLoading(false);
              }} disabled={aiLoading || scored.length === 0}
                style={{ background: (aiLoading || scored.length === 0) ? "#1a1a2e" : "#e63946", border:"none", borderRadius:10, padding:"12px 20px", color:"#fff", fontSize:13, fontWeight:700, cursor:(aiLoading || scored.length === 0) ? "default" : "pointer", width:"100%" }}>
                {aiLoading ? "⟳ Analyzing…" : "⚡ RUN AI INTEL BRIEF"}
              </button>
            </div>
            {aiAnalysis && (
              <div style={{ background:"#0d1117", border:"1px solid #e6394633", borderRadius:12, padding:16, marginBottom:16 }}>
                <div style={{ fontSize:10, color:"#e63946", letterSpacing:2, fontWeight:700, marginBottom:12 }}>STRATEGIC ANALYSIS REPORT</div>
                {aiAnalysis.split("\n\n").filter(Boolean).map((p, i) => <p key={i} style={{ fontSize:13, color:"#9ca3af", lineHeight:1.8, margin:"0 0 12px" }}>{p}</p>)}
              </div>
            )}
            <div style={{ background:"#0d1117", border:"1px solid #f4a26133", borderRadius:12, padding:16, marginTop:16, textAlign:"center" }}>
              <div style={{ fontSize:20, marginBottom:8 }}>🦏</div>
              <div style={{ fontSize:14, fontWeight:800, color:"#e8eaf0", marginBottom:6 }}>Keep RINO Report Free</div>
              <p style={{ fontSize:12, color:"#6b7280", margin:"0 0 14px", lineHeight:1.7 }}>100% free — no paywalls, no ads. Help cover API costs.</p>
              <div style={{ display:"flex", gap:10, justifyContent:"center" }}>
                <a href={STRIPE_RECURRING} target="_blank" rel="noopener noreferrer" style={{ padding:"10px 20px", borderRadius:10, background:"#f4a261", color:"#fff", fontWeight:800, fontSize:13, textDecoration:"none" }}>☕ $3/month</a>
                <a href={STRIPE_ONETIME} target="_blank" rel="noopener noreferrer" style={{ padding:"10px 20px", borderRadius:10, background:"#1a1a2e", color:"#f4a261", border:"1px solid #f4a26144", fontWeight:800, fontSize:13, textDecoration:"none" }}>💵 One-Time Tip</a>
              </div>
            </div>
          </>
        )}
      </div>

      {/* MODALS */}
      <DrillModal member={drillMember} onClose={() => setDrillMember(null)} />
      <ContactModal member={contactMember} onClose={() => setContactMember(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
