<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RINO Report — Congressional Loyalty Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #DC2626;
      --red-dark: #991B1B;
      --red-light: #EF4444;
      --red-dim: rgba(220,38,38,0.12);
      --blue: #1D4ED8;
      --blue-light: #3B82F6;
      --blue-dim: rgba(59,130,246,0.12);
      --gold: #D97706;
      --gold-light: #F59E0B;
      --gold-dim: rgba(217,119,6,0.12);
      --bg: #080810;
      --bg2: #0e0e1a;
      --bg3: #141420;
      --bg4: #1a1a28;
      --border: #1e1e2e;
      --border-hover: #2e2e42;
      --text: #F1F5F9;
      --text-dim: #B0BEC5;
      --text-muted: #78909C;
      --green: #10B981;
      --green-dim: rgba(16,185,129,0.12);
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; -webkit-font-smoothing: antialiased; }

    #root { min-height: 100vh; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* HEADER */
    .site-header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 var(--border), var(--shadow);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 60px;
    }
    .logo-block { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 32px; height: 32px;
      background: var(--red);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
      flex-shrink: 0;
    }
    .logo-text { display: flex; flex-direction: column; gap: 1px; }
    .logo-title {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
    }
    .logo-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header-stats {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .hstat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-width: 72px;
    }
    .hstat-val {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .hstat-val.red { color: var(--red-light); }
    .hstat-val.blue { color: var(--blue-light); }
    .hstat-val.gold { color: var(--gold-light); }
    .hstat-label {
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .header-divider { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid rgba(16,185,129,0.25);
      padding: 5px 12px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--green);
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }

    /* STRIPE SUPPORT BAR */
    .support-bar {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 7px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .support-bar-text {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-muted);
    }
    .support-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
      cursor: pointer;
    }
    .support-btn.monthly {
      background: var(--red-dim);
      border: 1px solid rgba(220,38,38,0.3);
      color: var(--red-light);
    }
    .support-btn.monthly:hover { background: rgba(220,38,38,0.2); border-color: var(--red); }
    .support-btn.onetime {
      background: var(--gold-dim);
      border: 1px solid rgba(217,119,6,0.3);
      color: var(--gold-light);
    }
    .support-btn.onetime:hover { background: rgba(217,119,6,0.2); border-color: var(--gold); }

    /* STAT BOXES */
    .stat-row {
      max-width: 1400px;
      margin: 20px auto 0;
      padding: 0 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .stat-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .stat-box:hover { border-color: var(--border-hover); }
    .stat-box-icon {
      font-size: 13px;
      margin-bottom: 8px;
      opacity: 0.6;
    }
    .stat-box-val {
      font-family: var(--font-head);
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .stat-box.red .stat-box-val { color: var(--red-light); }
    .stat-box.gold .stat-box-val { color: var(--gold-light); }
    .stat-box.green .stat-box-val { color: var(--green); }
    .stat-box.blue .stat-box-val { color: var(--blue-light); }
    .stat-box-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* TABS */
    .tabs-wrap {
      max-width: 1400px;
      margin: 16px auto 0;
      padding: 0 28px;
    }
    .tabs {
      display: flex;
      gap: 1px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: none;
      border: none;
      padding: 10px 18px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text-dim); }
    .tab.active { color: var(--text); border-bottom-color: var(--red); }

    /* MAIN CONTENT */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 28px;
    }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-search {
      flex: 1;
      min-width: 200px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .filter-search:focus { border-color: var(--red-dark); }
    .filter-select {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .filter-select:focus { border-color: var(--red-dark); }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 16px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--red); color: var(--text); }
    .filter-btn.active { background: rgba(200,16,46,0.1); }

    /* MEMBER GRID */
    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* MEMBER CARD */
    .member-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .member-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .member-card.r { border-left: 3px solid var(--red); }
    .member-card.d { border-left: 3px solid var(--blue-light); }
    .member-card.live-scored { background: var(--bg3); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .card-name {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }
    .card-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .card-score-wrap { text-align: right; }
    .card-score {
      font-family: var(--font-head);
      font-size: 32px;
      line-height: 1;
    }
    .card-score.high { color: var(--red-light); }
    .card-score.mid { color: var(--gold-light); }
    .card-score.low { color: var(--blue-light); }
    .card-score-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .score-bar-bg {
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      margin: 10px 0 8px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-party-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 500;
    }
    .badge-r { background: var(--red-dim); color: var(--red-light); border: 1px solid rgba(220,38,38,0.25); }
    .badge-d { background: var(--blue-dim); color: var(--blue-light); border: 1px solid rgba(59,130,246,0.25); }
    .badge-i { background: var(--gold-dim); color: var(--gold-light); border: 1px solid rgba(217,119,6,0.25); }
    .live-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .live-tag-dot { width: 5px; height: 5px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }

    /* LOADING */
    .loading-wrap {
      text-align: center;
      padding: 80px 24px;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* CONTACT MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .modal-title {
      font-family: var(--font-head);
      font-size: 24px;
      letter-spacing: 1px;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s;
    }
    .modal-close:hover { border-color: var(--red); color: var(--text); }
    .modal-section { margin-bottom: 20px; }
    .modal-section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.15s;
    }
    .contact-link:hover { border-color: var(--text-dim); color: var(--text); }
    .ai-draft-section { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .issue-select-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
    .issue-select {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }
    .draft-btn {
      background: var(--red-dark);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      color: white;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .draft-btn:hover { background: var(--red); }
    .draft-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .draft-output {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
      white-space: pre-wrap;
      min-height: 80px;
    }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--green); color: var(--green); }

    /* MY REPS TAB */
    .zip-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      max-width: 400px;
    }
    .zip-input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      outline: none;
      letter-spacing: 2px;
    }
    .zip-input:focus { border-color: var(--red-dark); }
    .zip-btn {
      background: var(--red-dark);
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      color: white;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .zip-btn:hover { background: var(--red); }

    /* ANALYSIS TAB */
    .intel-wrap {
      max-width: 800px;
    }
    .intel-btn {
      background: linear-gradient(135deg, var(--red-dark), #6b0010);
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      color: white;
      font-family: var(--font-mono);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: opacity 0.15s;
    }
    .intel-btn:hover { opacity: 0.88; }
    .intel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .intel-output {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-dim);
      white-space: pre-wrap;
    }

    /* HEROES / HALF-ASSES */
    .ranked-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 700px;
    }
    .ranked-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .ranked-item:hover { border-color: var(--border-hover); transform: translateX(2px); }
    .rank-num {
      font-family: var(--font-head);
      font-size: 22px;
      color: var(--text-muted);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }
    .rank-num.top3 { color: var(--gold); }
    .rank-info { flex: 1; }
    .rank-name { font-weight: 700; font-size: 14px; }
    .rank-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .rank-score {
      font-family: var(--font-head);
      font-size: 28px;
    }
    .rank-score.high { color: var(--red-light); }
    .rank-score.low { color: var(--blue-light); }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
    }

    /* SECTION TITLE */
    .section-title {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      color: var(--text);
    }
    .section-sub {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .header-stats { display: none; }
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .member-grid { grid-template-columns: 1fr; }
      .logo-r { font-size: 40px; }
      .logo-title { font-size: 18px; }
    }
    @media (max-width: 480px) {
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const FUNCTION_URL = "/.netlify/functions/congress";

const STRIPE_MONTHLY = "https://buy.stripe.com/7sYbJ2gEV7sC9RDcBNfEk01";
const STRIPE_ONETIME = "https://buy.stripe.com/00wfZi74l00agg145hfEk00";

const ISSUES = [
  "Immigration & Border Security",
  "Government Spending & Debt",
  "Second Amendment",
  "Energy & Fossil Fuels",
  "Election Integrity",
  "Foreign Aid",
  "China Policy",
  "Crime & Law Enforcement",
  "Healthcare Policy",
  "Trade & Tariffs",
];

const STATE_MAP = {

  NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",
  ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",
  RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",
  TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",
  WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"D.C.",PR:"Puerto Rico",
  GU:"Guam",VI:"Virgin Islands",MP:"N. Mariana Islands",AS:"American Samoa",
};

function scoreColor(s) {
  if (s >= 70) return "high";
  if (s >= 40) return "mid";
  return "low";
}

function barColor(s, party) {
  if (party === "R") return `hsl(${350 - s * 1.5}, 70%, 45%)`;
  return "#1a5fa8";
}

async function callClaude(prompt) {
  const resp = await fetch("/.netlify/functions/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await resp.json();
  return data.content?.map(b => b.text || "").join("") || "No response.";
}

function ContactModal({ member, onClose }) {
  const [issue, setIssue] = useState(ISSUES[0]);
  const [draft, setDraft] = useState("");
  const [loading, setLoading] = useState(false);
  const [copied, setCopied] = useState(false);

  const generateDraft = async () => {
    setLoading(true);
    setDraft("");
    try {
      const score = member.alignment ?? 72;
      const stance = score >= 60 ? "conservative loyalty" : score >= 35 ? "mixed record" : "frequent opposition to conservative priorities";
      const text = await callClaude(
        `Write a firm but respectful constituent letter to ${member.name}, ${member.party === "R" ? "Republican" : "Democrat"} from ${STATE_MAP[member.state] || member.state}, regarding ${issue}. ` +
        `This member has a RINO Report loyalty score of ${score}/100, indicating ${stance}. ` +
        `If they are a Republican with a low score, call them out specifically for not representing conservative values. ` +
        `Keep it under 250 words. Be direct. Sign off as "A Concerned Constituent."`
      );
      setDraft(text);
    } catch(e) {
      setDraft("Error generating draft. Please try again.");

    setLoading(false);

  const copy = () => {
    navigator.clipboard.writeText(draft).then(() => {

// ── TRACKER TAB ──────────────────────────────────────────────────────────────
function TrackerTab({ members, onSelect }) {
  const [search, setSearch] = useState("");
  const [partyFilter, setPartyFilter] = useState("ALL");
  const [chamberFilter, setChamberFilter] = useState("ALL");
  const [sortBy, setSortBy] = useState("score");

  const filtered = members
    .filter(m => {
      if (partyFilter !== "ALL" && m.party !== partyFilter) return false;
      if (chamberFilter !== "ALL" && (m.chamber || "").toLowerCase() !== chamberFilter.toLowerCase()) return false;
      if (search) {
        const q = search.toLowerCase();
        return (m.name || "").toLowerCase().includes(q) ||
               (m.state || "").toLowerCase().includes(q) ||
               (STATE_MAP[m.state] || "").toLowerCase().includes(q);
      }
      return true;
    })
    .sort((a, b) => {
      if (sortBy === "score") return (b.alignment ?? 0) - (a.alignment ?? 0);
      if (sortBy === "score-asc") return (a.alignment ?? 0) - (b.alignment ?? 0);
      if (sortBy === "name") return (a.name || "").localeCompare(b.name || "");
      return 0;
    });

  return (
    <div>
      <div className="filters">
        <input
          className="filter-search"
          placeholder="Search by name or state…"
          value={search}
          onChange={e => setSearch(e.target.value)}
        />
        <select className="filter-select" value={partyFilter} onChange={e => setPartyFilter(e.target.value)}>
          <option value="ALL">All Parties</option>
          <option value="R">Republican</option>
          <option value="D">Democrat</option>
          <option value="ID">Independent</option>
        </select>
        <select className="filter-select" value={chamberFilter} onChange={e => setChamberFilter(e.target.value)}>
          <option value="ALL">Both Chambers</option>
          <option value="House">House</option>
          <option value="Senate">Senate</option>
        </select>
        <select className="filter-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
          <option value="score">Highest Score</option>
          <option value="score-asc">Lowest Score</option>
          <option value="name">Name A–Z</option>
        </select>
        <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)",whiteSpace:"nowrap"}}>
          {filtered.length} members
        </span>
      </div>
      {filtered.length === 0
        ? <div className="empty-state">No members match your filters.</div>
        : <div className="member-grid">
            {filtered.map(m => <MemberCard key={m.bioguideId} member={m} onClick={onSelect} />)}
          </div>
      }
    </div>
  );
}

// ── MY REPS TAB ───────────────────────────────────────────────────────────────
function MyRepsTab({ members, onSelect }) {
  const [zip, setZip] = useState("");
  const [state, setState] = useState("");
  const [reps, setReps] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const lookup = async () => {
    if (zip.length !== 5) { setError("Enter a 5-digit ZIP code."); return; }
    setLoading(true);
    setError("");
    setReps([]);
    try {
      const resp = await fetch(`https://api.zippopotam.us/us/${zip}`);
      if (!resp.ok) throw new Error("ZIP not found.");
      const data = await resp.json();
      const st = data.places?.[0]?.["state abbreviation"] || "";
      setState(st);
      const found = members.filter(m => m.state === st);
      setReps(found);
      if (found.length === 0) setError(`No members found for state ${st}.`);
    } catch (e) {
      setError(e.message || "Lookup failed.");
    }
    setLoading(false);
  };

  return (
    <div>
      <div className="section-title">MY REPS</div>
      <div className="section-sub">Find your congressional representatives by ZIP code</div>
      <div className="zip-wrap">
        <input
          className="zip-input"
          placeholder="12345"
          maxLength={5}
          value={zip}
          onChange={e => setZip(e.target.value.replace(/\D/g,""))}
          onKeyDown={e => e.key === "Enter" && lookup()}
        />
        <button className="zip-btn" onClick={lookup} disabled={loading}>
          {loading ? "…" : "LOOKUP"}
        </button>
      </div>
      {error && <div style={{fontFamily:"var(--font-mono)",fontSize:12,color:"var(--red-light)",marginBottom:16}}>{error}</div>}
      {state && reps.length > 0 && (
        <div>
          <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-dim)",marginBottom:12}}>
            Representatives for {STATE_MAP[state] || state} ({reps.length} members)
          </div>
          <div className="member-grid">
            {reps.map(m => <MemberCard key={m.bioguideId} member={m} onClick={onSelect} />)}
          </div>
        </div>
      )}
    </div>
  );
}

// ── ANALYSIS TAB ──────────────────────────────────────────────────────────────
function AnalysisTab({ members }) {
  const [brief, setBrief] = useState("");
  const [loading, setLoading] = useState(false);

  const reps = members.filter(m => m.party === "R");
  const avgScore = reps.length ? Math.round(reps.reduce((a, m) => a + (m.alignment ?? 72), 0) / reps.length) : 0;
  const liveCount = members.filter(m => m.liveScored).length;
  const heroes = [...reps].sort((a,b) => (b.alignment ?? 0) - (a.alignment ?? 0)).slice(0, 5).map(m => `${m.name} (${m.alignment})`).join(", ");
  const halfasses = [...reps].sort((a,b) => (a.alignment ?? 100) - (b.alignment ?? 100)).slice(0, 5).map(m => `${m.name} (${m.alignment})`).join(", ");

  const generateBrief = async () => {
    setLoading(true);
    setBrief("");
    try {
      const text = await callClaude(
        `You are a conservative political analyst for RINO Report, a congressional loyalty tracker. ` +
        `Generate a sharp, direct intelligence brief about the current state of the Republican party in Congress. ` +
        `Data: ${members.length} total members tracked, ${reps.length} Republicans, avg GOP loyalty score ${avgScore}/100, ` +
        `${liveCount} members with live vote data. ` +
        `Top patriots: ${heroes}. Biggest RINOs: ${halfasses}. ` +
        `Write 3-4 punchy paragraphs. Call out sellouts by name. Be direct, not diplomatic. No fluff. ` +
        `End with one actionable recommendation for conservative voters.`
      );
      setBrief(text);
    } catch(e) {
      setBrief("Error generating brief. Please try again.");
    }
    setLoading(false);
  };

  return (
    <div className="intel-wrap">
      <div className="section-title">AI INTEL BRIEF</div>
      <div className="section-sub">AI-generated analysis of current congressional loyalty data</div>
      <button className="intel-btn" onClick={generateBrief} disabled={loading}>
        {loading ? "⚙ Generating Brief…" : "⚡ Generate Intel Brief"}
      </button>
      {loading && <div className="intel-output" style={{color:"var(--text-muted)"}}>Analyzing congressional data…</div>}
      {brief && <div className="intel-output">{brief}</div>}
    </div>
  );
}

// ── MEDIA TAB ─────────────────────────────────────────────────────────────────
function MediaTab() {
  const [typeFilter, setTypeFilter] = useState("All");
  const [leanFilter, setLeanFilter] = useState("All");
  const [sortBy, setSortBy] = useState("score");
  const [selected, setSelected] = useState(null);

  const leans = ["All", "Far Left", "Left", "Center-Left", "Center", "Center-Right", "Right", "Far Right", "Center / Classical Liberal", "Right / Libertarian", "Varies"];
  const leanSimple = ["All", "Left", "Center", "Right"];

  const filtered = MEDIA_OUTLETS
    .filter(m => {
      if (typeFilter !== "All" && m.type !== typeFilter) return false;
      if (leanFilter === "Left") return m.lean.includes("Left") || m.lean === "Far Left";
      if (leanFilter === "Right") return m.lean.includes("Right") || m.lean === "Far Right";
      if (leanFilter === "Center") return m.lean.includes("Center") || m.lean === "Varies" || m.lean === "Center / Classical Liberal";
      return true;
    })
    .sort((a, b) => {
      if (sortBy === "score") return b.score - a.score;
      if (sortBy === "score-asc") return a.score - b.score;
      if (sortBy === "bias") return b.bias - a.bias;
      if (sortBy === "accuracy") return b.accuracy - a.accuracy;
      return a.name.localeCompare(b.name);
    });

  const scoreColor = (s) => s >= 70 ? "var(--green)" : s >= 50 ? "var(--gold-light)" : s >= 35 ? "var(--red-light)" : "#ef4444";
  const leanColor = (l) => {
    if (l.includes("Far Left") || l === "Far Left") return "#818cf8";
    if (l.includes("Left")) return "#60a5fa";
    if (l.includes("Far Right")) return "#f97316";
    if (l.includes("Right")) return "var(--red-light)";
    return "var(--green)";
  };

  return (
    <div>
      <div className="section-title">MEDIA SCORECARD</div>
      <div className="section-sub">Mainstream and independent outlets scored on bias, accuracy, transparency, and record on major stories</div>

      <div style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px 18px",marginBottom:20,fontSize:13,color:"var(--text-dim)",lineHeight:1.7}}>
        Each outlet is scored across four criteria worth 25 points each: <strong style={{color:"var(--text)"}}>Bias</strong> (minimal = high score), <strong style={{color:"var(--text)"}}>Accuracy</strong> (correction/retraction rate), <strong style={{color:"var(--text)"}}>Transparency</strong> (ownership, funding, conflicts), and <strong style={{color:"var(--text)"}}>Big Story Record</strong> (COVID origins, Russia hoax, Hunter laptop, censorship). Scores are nonpartisan — outlets are penalized for suppression and amplification regardless of political direction.
      </div>

      <div className="filters" style={{marginBottom:16}}>
        <select className="filter-select" value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>
          <option value="All">All Outlets</option>
          <option value="Mainstream">Mainstream</option>
          <option value="Independent">Independent</option>
        </select>
        <select className="filter-select" value={leanFilter} onChange={e => setLeanFilter(e.target.value)}>
          <option value="All">All Leanings</option>
          <option value="Left">Left-Leaning</option>
          <option value="Center">Center</option>
          <option value="Right">Right-Leaning</option>
        </select>
        <select className="filter-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
          <option value="score">Highest Score</option>
          <option value="score-asc">Lowest Score</option>
          <option value="accuracy">Most Accurate</option>
          <option value="bias">Least Biased</option>
          <option value="name">Name A–Z</option>
        </select>
        <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)"}}>{filtered.length} outlets</span>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.map(outlet => (
          <div
            key={outlet.name}
            onClick={() => setSelected(outlet)}
            style={{
              background:"var(--bg2)",
              border:"1px solid var(--border)",
              borderRadius:"var(--radius)",
              padding:"16px 20px",
              cursor:"pointer",
              transition:"all 0.18s ease",
            }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--border-hover)"; e.currentTarget.style.transform = "translateX(2px)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.transform = "translateX(0)"; }}
          >
            <div style={{display:"flex",alignItems:"flex-start",gap:16,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:200}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,fontSize:15}}>{outlet.name}</span>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:10,padding:"2px 8px",borderRadius:4,background:`${leanColor(outlet.lean)}18`,color:leanColor(outlet.lean),border:`1px solid ${leanColor(outlet.lean)}30`}}>{outlet.lean}</span>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:10,padding:"2px 8px",borderRadius:4,background:"var(--bg3)",color:"var(--text-muted)",border:"1px solid var(--border)"}}>{outlet.type}</span>
                </div>
                <div style={{fontSize:12,color:"var(--text-dim)",lineHeight:1.6,marginBottom:8}}>{outlet.notes}</div>
                <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                  {[["Bias",outlet.bias],["Accuracy",outlet.accuracy],["Transparency",outlet.transparency],["Big Stories",outlet.big_story]].map(([l,v]) => (
                    <div key={l} style={{display:"flex",gap:4,alignItems:"center"}}>
                      <span style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>{l}:</span>
                      <span style={{fontFamily:"var(--font-mono)",fontSize:11,color: v >= 18 ? "var(--green)" : v >= 12 ? "var(--gold-light)" : "var(--red-light)",fontWeight:600}}>{v}/25</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{textAlign:"center",flexShrink:0}}>
                <div style={{fontFamily:"var(--font-head)",fontSize:44,fontWeight:700,lineHeight:1,color:scoreColor(outlet.score)}}>{outlet.score}</div>
                <div style={{fontFamily:"var(--font-mono)",fontSize:9,color:"var(--text-muted)",textTransform:"uppercase",marginTop:2}}>/ 100</div>
              </div>
            </div>
          </div>
        ))}
      </div>

      {selected && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setSelected(null)}>
          <div className="modal">
            <div className="modal-header">
              <div>
                <div className="modal-title">{selected.name}</div>
                <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)",marginTop:4}}>
                  {selected.lean} · {selected.type} · Est. {selected.founded}
                </div>
              </div>
              <button className="modal-close" onClick={() => setSelected(null)}>×</button>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:20}}>
              {[["Bias",selected.bias,"Minimal bias = higher score"],["Accuracy",selected.accuracy,"Correction & retraction rate"],["Transparency",selected.transparency,"Ownership & funding disclosed"],["Big Stories",selected.big_story,"COVID, Russia hoax, laptop"]].map(([l,v,d]) => (
                <div key={l} style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:6,padding:"10px 12px",textAlign:"center"}}>
                  <div style={{fontFamily:"var(--font-head)",fontSize:28,fontWeight:700,color: v >= 18 ? "var(--green)" : v >= 12 ? "var(--gold-light)" : "var(--red-light)"}}>{v}</div>
                  <div style={{fontFamily:"var(--font-mono)",fontSize:9,color:"var(--text-muted)",textTransform:"uppercase"}}>{l}</div>
                </div>
              ))}
            </div>

            <div className="modal-section">
              <div className="modal-section-title">Ownership</div>
              <div style={{fontSize:13,color:"var(--text-dim)"}}>{selected.owner}</div>
            </div>

            <div className="modal-section">
              <div className="modal-section-title">Assessment</div>
              <div style={{fontSize:13,color:"var(--text-dim)",lineHeight:1.7}}>{selected.notes}</div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div className="modal-section">
                <div className="modal-section-title" style={{color:"var(--green)"}}>Got Right</div>
                {selected.got_right.map((v,i) => (
                  <div key={i} style={{display:"flex",gap:8,fontSize:12,color:"var(--text-dim)",marginBottom:4}}>
                    <span style={{color:"var(--green)",flexShrink:0}}>✓</span>{v}
                  </div>
                ))}
              </div>
              <div className="modal-section">
                <div className="modal-section-title" style={{color:"var(--red-light)"}}>Got Wrong</div>
                {selected.got_wrong.map((v,i) => (
                  <div key={i} style={{display:"flex",gap:8,fontSize:12,color:"var(--text-dim)",marginBottom:4}}>
                    <span style={{color:"var(--red-light)",flexShrink:0}}>✗</span>{v}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DogeAgencies() {
  const [sortBy, setSortBy] = useState("cooperation");

    if (sortBy === "waste") return a.waste_score - b.waste_score;
    if (sortBy === "cuts") return b.cuts_b - a.cuts_b;

function ScotusTab({ onSelect }) {
  const [selected, setSelected] = useState(null);

  const conservatives = SCOTUS.filter(j => j.score >= 60).sort((a,b) => b.score - a.score);
  const liberals = SCOTUS.filter(j => j.score < 60).sort((a,b) => a.score - b.score);

  const handleSelect = (j) => {
    setSelected(j);
    if (onSelect) onSelect(j);
  };

  return (
    <div>
      <div className="section-title">SUPREME COURT</div>
      <div className="section-sub">All 9 justices scored on constitutional philosophy, landmark decisions, and fidelity to original text</div>

      <div style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"14px 18px",marginBottom:24,fontSize:13,color:"var(--text-dim)",lineHeight:1.7}}>
        Scores reflect judicial philosophy (originalism vs. living constitutionalism), consistency with constitutional text, and key decisions on federal power, individual rights, and separation of powers. Higher scores indicate stronger fidelity to originalism and constitutional restraint.
      </div>

      <div style={{marginBottom:32}}>
        <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)",letterSpacing:"0.5px",textTransform:"uppercase",marginBottom:12}}>Conservative Bloc</div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {conservatives.map(j => <ScotusCard key={j.name} justice={j} onClick={handleSelect} />)}
        </div>
      </div>

      <div>
        <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)",letterSpacing:"0.5px",textTransform:"uppercase",marginBottom:12}}>Progressive Bloc</div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {liberals.map(j => <ScotusCard key={j.name} justice={j} onClick={handleSelect} />)}

      {selected && <ScotusModal justice={selected} onClose={() => setSelected(null)} />}
    </div>
  );
}

function ObstructorsTab({ members, onSelect }) {
  const [partyFilter, setPartyFilter] = useState("ALL");
  const [sortBy, setSortBy] = useState("votes-against");

  // Members who are live scored and have low alignment
  // Obstructor = live scored Republican with score < 72 (voted against)
  // OR any Democrat who is live scored (they almost always vote against)
  // We flag anyone with alignment <= 65 who is live scored as an obstructor
  // and show how many votes they opposed

  const obstructors = members
    .filter(m => m.liveScored)
    .filter(m => {
      if (partyFilter === "R") return m.party === "R" && m.alignment < 72;
      if (partyFilter === "D") return m.party === "D";
      // ALL: Republicans who voted against + Democrats who are live scored
      return (m.party === "R" && m.alignment < 72) || m.party === "D";
    })
    .map(m => {
      // Estimate votes against from score delta
      const baseline = 72;
      const delta = m.alignment - baseline;
      // Each "against" vote costs -10, each "not voting" costs -3
      // Rough estimate: how many times did they obstruct?
      const votesAgainst = Math.max(0, Math.round(Math.abs(Math.min(0, delta)) / 8));
      return { ...m, votesAgainst };
    })
    .filter(m => m.votesAgainst >= 1 || m.party === "D")
    .sort((a, b) => {
      if (sortBy === "votes-against") return b.votesAgainst - a.votesAgainst || a.alignment - b.alignment;
      if (sortBy === "score") return a.alignment - b.alignment;
      if (sortBy === "name") return (a.name || "").localeCompare(b.name || "");
      return 0;
    });

  const rino_count = obstructors.filter(m => m.party === "R").length;
  const dem_count = obstructors.filter(m => m.party === "D").length;

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:16,marginBottom:16}}>
        <div>
          <div className="section-title" style={{color:"var(--red-light)"}}>🚧 OBSTRUCTORS</div>
          <div className="section-sub">Members who repeatedly voted against conservative priorities — the Hall of Shame</div>
        </div>
        <div style={{display:"flex",gap:16}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"var(--font-head)",fontSize:32,color:"var(--gold)"}}>{rino_count}</div>
            <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>RINO TRAITORS</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"var(--font-head)",fontSize:32,color:"#4d8fd4"}}>{dem_count}</div>
            <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>DEMS BLOCKING</div>
          </div>
        </div>
      </div>

      <div style={{background:"rgba(200,16,46,0.06)",border:"1px solid rgba(200,16,46,0.2)",borderRadius:8,padding:"12px 16px",marginBottom:20,fontFamily:"var(--font-mono)",fontSize:11,color:"var(--red-light)",lineHeight:1.6}}>
        Members with verified votes against conservative priorities. Republican entries indicate active opposition to their own party's agenda. All data sourced from official Congressional records.
      </div>

      <div className="filters">
        <select className="filter-select" value={partyFilter} onChange={e => setPartyFilter(e.target.value)}>
          <option value="ALL">All Obstructors</option>
          <option value="R">RINOs Only</option>
          <option value="D">Democrats Only</option>
        </select>
        <select className="filter-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
          <option value="votes-against">Most Votes Against</option>
          <option value="score">Lowest Score</option>
          <option value="name">Name A–Z</option>
        </select>
        <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)"}}>{obstructors.length} obstructors</span>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {obstructors.map((m, i) => (
          <div
            key={m.bioguideId}
            className="ranked-item"
            style={{borderLeft: m.party === "R" ? "3px solid var(--gold)" : "3px solid #1a5fa8"}}
            onClick={() => onSelect(m)}
          >
            <div style={{fontFamily:"var(--font-head)",fontSize:20,color:"var(--text-muted)",width:28,textAlign:"right",flexShrink:0}}>

            </div>

                {m.alignment}

function KeyVotesTab() {
  const [filter, setFilter] = useState("All");
  const [expanded, setExpanded] = useState(null);
  const [voteData, setVoteData] = useState({});
  const [loadingVote, setLoadingVote] = useState(null);

  const categories = ["All", ...new Set(KEY_VOTES_LIBRARY.map(v => v.category))];
  const filtered = filter === "All" ? KEY_VOTES_LIBRARY : KEY_VOTES_LIBRARY.filter(v => v.category === filter);

  const loadVoteBreakdown = async (vote) => {
    const key = `${vote.session}-${vote.roll}`;
    if (voteData[key]) { setExpanded(expanded === key ? null : key); return; }
    setLoadingVote(key);
    try {
      const resp = await fetch(`${FUNCTION_URL}/house-vote/119/${vote.session}/${vote.roll}/members`);
      const data = await resp.json();
      const members = (data.houseRollCallVoteMemberVotes && data.houseRollCallVoteMemberVotes.results) || [];
      const ayes = members.filter(m => m.voteCast === "Aye" || m.voteCast === "Yes");
      const nays = members.filter(m => m.voteCast === "No" || m.voteCast === "Nay");
      const notVoting = members.filter(m => m.voteCast === "Not Voting" || m.voteCast === "Present");
      // Republican defectors (voted against conservative position)
      const rDefectors = vote.conservativeVote === "Aye"
        ? members.filter(m => m.voteParty === "R" && (m.voteCast === "No" || m.voteCast === "Nay"))
        : members.filter(m => m.voteParty === "R" && (m.voteCast === "Aye" || m.voteCast === "Yes"));
      // Dem crossovers (voted with conservatives)
      const dCrossovers = vote.conservativeVote === "Aye"
        ? members.filter(m => m.voteParty === "D" && (m.voteCast === "Aye" || m.voteCast === "Yes"))
        : members.filter(m => m.voteParty === "D" && (m.voteCast === "No" || m.voteCast === "Nay"));
      setVoteData(prev => ({ ...prev, [key]: { ayes, nays, notVoting, rDefectors, dCrossovers, total: members.length } }));
      setExpanded(key);
    } catch(e) {
      console.error("Vote load error:", e);
    }
    setLoadingVote(null);
  };

  return (
    <div>
      <div className="section-title">KEY VOTES LIBRARY</div>
      <div className="section-sub">The votes used to calculate conservative loyalty scores — click any vote to see the full breakdown</div>

      <div style={{background:"var(--gold-dim)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:"var(--radius)",padding:"14px 18px",marginBottom:20,lineHeight:1.8}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:6,color:"var(--gold-light)"}}>How scores work — in plain English:</div>
        <div style={{fontSize:13,color:"var(--text-dim)"}}>
          Every member starts at a baseline score. Each time they vote on a key issue, their score goes up or down based on how they voted. Vote with conservatives → score goes up. Vote against → score drops hard. Skip the vote entirely → small penalty. The more votes we track, the more accurate the picture. A score of 90+ means they show up and deliver. A score under 60 means they talk conservative but vote like a Democrat.
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {categories.map(c => (
          <button key={c} className={`filter-btn ${filter===c?"active":""}`} onClick={() => setFilter(c)}>{c}</button>
        ))}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.map((v, i) => {
          const key = `${v.session}-${v.roll}`;
          const isExpanded = expanded === key;
          const data = voteData[key];
          const isLoading = loadingVote === key;
          return (
            <div key={i} style={{background:"var(--bg2)",border:`1px solid ${isExpanded ? "var(--border-hover)" : "var(--border)"}`,borderRadius:"var(--radius)",borderLeft:`3px solid ${CATEGORY_COLORS[v.category] || "var(--red)"}`,overflow:"hidden",transition:"all 0.18s"}}>
              <div
                style={{padding:"16px 20px",cursor:"pointer"}}
                onClick={() => loadVoteBreakdown(v)}
              >
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8,marginBottom:8}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15,marginBottom:2}}>{v.label}</div>
                    <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>
                      {v.date} · Session {v.session}, Roll #{v.roll}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:10,padding:"3px 10px",borderRadius:4,background:`${CATEGORY_COLORS[v.category]}22`,color:CATEGORY_COLORS[v.category],border:`1px solid ${CATEGORY_COLORS[v.category]}44`}}>{v.category}</span>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:10,padding:"3px 10px",borderRadius:4,background:"var(--green-dim)",color:"var(--green)",border:"1px solid rgba(16,185,129,0.25)"}}>Conservative: {v.conservativeVote}</span>

                        : <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:200,overflowY:"auto"}}>
                            {data.rDefectors.map((m,i) => (
                              <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 8px",background:"rgba(245,158,11,0.06)",borderRadius:4,border:"1px solid rgba(245,158,11,0.15)"}}>
                                <span style={{color:"var(--text)"}}>{m.firstName} {m.lastName}</span>
                                <span style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>{m.voteState}</span>
                              </div>
                            ))}
                          </div>
                      }
                    </div>

                    {/* Dem crossovers */}
                    <div>
                      <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--blue-light)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>
                        Democrat Crossovers ({data.dCrossovers.length})
                      </div>
                      {data.dCrossovers.length === 0
                        ? <div style={{fontSize:12,color:"var(--text-muted)"}}>No Democrats crossed over.</div>
                        : <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:200,overflowY:"auto"}}>
                            {data.dCrossovers.map((m,i) => (
                              <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 8px",background:"rgba(59,130,246,0.06)",borderRadius:4,border:"1px solid rgba(59,130,246,0.15)"}}>
                                <span style={{color:"var(--text)"}}>{m.firstName} {m.lastName}</span>
                                <span style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>{m.voteState}</span>
                              </div>
                            ))}
                          </div>
                      }
                    </div>
                  </div>

                  {/* Vote impact — score change per member */}
                  <div style={{marginTop:16,borderTop:"1px solid var(--border)",paddingTop:16}}>
                    <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Score Impact on Republicans</div>
                    <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                      <div style={{fontSize:12,color:"var(--text-dim)"}}>
                        <span style={{color:"var(--green)",fontWeight:600}}>{data.ayes.filter(m=>m.voteParty==="R").length} Republicans</span> voted Aye → each earned <span style={{color:"var(--green)",fontWeight:600}}>+6 pts</span>
                      </div>
                      <div style={{fontSize:12,color:"var(--text-dim)"}}>
                        <span style={{color:"var(--red-light)",fontWeight:600}}>{data.rDefectors.length} Republicans</span> voted No → each lost <span style={{color:"var(--red-light)",fontWeight:600}}>-10 pts</span>
                      </div>
                      <div style={{fontSize:12,color:"var(--text-dim)"}}>
                        <span style={{color:"var(--text-muted)",fontWeight:600}}>{data.notVoting.filter(m=>m.voteParty==="R").length} Republicans</span> skipped → each lost <span style={{color:"var(--text-muted)",fontWeight:600}}>-3 pts</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{marginTop:24,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"16px 20px"}}>
        <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--text-muted)",marginBottom:4}}>SOURCES & METHODOLOGY</div>
        <div style={{fontSize:13,color:"var(--text-dim)",lineHeight:1.7}}>
          All vote data pulled live from the Congress.gov API. Key votes selected based on significance to conservative priorities: border security, fiscal responsibility, election integrity, and constitutional governance. Scores updated in real time on every page load.
        </div>
        <div style={{marginTop:12,display:"flex",gap:16,flexWrap:"wrap"}}>
          <a href="https://clerk.house.gov/Votes" target="_blank" rel="noopener noreferrer" style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--blue-light)",textDecoration:"none"}}>House Clerk Vote Records →</a>
          <a href="https://www.congress.gov/roll-call-votes" target="_blank" rel="noopener noreferrer" style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--blue-light)",textDecoration:"none"}}>Congress.gov Roll Calls →</a>
          <a href="https://heritageaction.com/scorecard" target="_blank" rel="noopener noreferrer" style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--blue-light)",textDecoration:"none"}}>Heritage Action Scorecard →</a>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadStatus, setLoadStatus] = useState("Initializing…");
  const [tab, setTab] = useState("tracker");
  const [selectedMember, setSelectedMember] = useState(null);
  const [scoreStatus, setScoreStatus] = useState("");

  const toMember = (m, chamber) => ({
    ...m,
    bioguideId: m.bioguideId || m.bioguideID,
    party: normalizeParty(m),
    alignment: normalizeParty(m) === "R" ? 72 : 8,
    liveScored: false,
    chamber: chamber,
  });

  // Detect chamber from terms field (may be array or object with 'item' array)
  const detectChamber = (m) => {
    let terms = m.terms || [];
    // Congress.gov sometimes wraps in {item: [...]}
    if (!Array.isArray(terms)) terms = terms.item || [];
    if (!Array.isArray(terms)) terms = [];
    const lastTerm = terms[terms.length - 1] || {};
    const ch = (lastTerm.chamber || "").toLowerCase();
    if (ch.includes("senate")) return "Senate";
    if (ch.includes("house")) return "House";
    const hasSenate = terms.some(t => (t.chamber || "").toLowerCase().includes("senate"));
    return hasSenate ? "Senate" : "House";
  };

  // Fetch all members from Congress.gov via Netlify proxy
  const loadMembers = async () => {
    let all = [];

    try {
      setLoadStatus("Loading members (1/2)…");
      const r1 = await fetch(`${FUNCTION_URL}?path=member&congress=119&currentMember=true&limit=250&offset=0`);
      const d1 = await r1.json();
      all = all.concat((d1.members || []).map(m => toMember(m, detectChamber(m))));

      setLoadStatus("Loading members (2/2)…");
      const r2 = await fetch(`${FUNCTION_URL}?path=member&congress=119&currentMember=true&limit=250&offset=250`);
      const d2 = await r2.json();
      all = all.concat((d2.members || []).map(m => toMember(m, detectChamber(m))));

      setLoadStatus("Loading members (3/3)…");
      const r3 = await fetch(`${FUNCTION_URL}?path=member&congress=119&currentMember=true&limit=250&offset=500`);
      const d3 = await r3.json();
      all = all.concat((d3.members || []).map(m => toMember(m, detectChamber(m))));
    } catch(e) {
      console.error("Member load error:", e);
    }

    // Deduplicate by bioguideId
    const seen = new Set();
    const deduped = all.filter(m => {
      if (!m.bioguideId) return true;
      if (seen.has(m.bioguideId)) return false;
      seen.add(m.bioguideId);
      return true;
    });

    setLoadStatus(`Loaded ${deduped.length} members`);

    setMembers(deduped);
    setLoading(false);
    return deduped;
  };

  function normalizeParty(m) {
    const p = (m.party || m.partyName || "").toUpperCase();
    if (p.startsWith("R")) return "R";
    if (p.startsWith("D")) return "D";
    return "ID";
  }

  // Key votes for conservative scorecard — 119th Congress
  // Format: [session, rollNumber, label, conservativeVote ("Aye"|"No")]
  const KEY_VOTES = [
    [1, 145, "One Big Beautiful Bill — Passage", "Aye"],
    [1, 190, "One Big Beautiful Bill — Final (Senate Amend)", "Aye"],
    [1,  74, "H.Res.1075 — Conservative Priority", "Aye"],
    [1,  47, "Laken Riley Act — Immigration Enforcement", "Aye"],
    [1,  11, "H.Res.8 — House Rules Package", "Aye"],
    [2,  65, "National Emergency Border Resolution", "Aye"],
    [1, 133, "No Welfare for Illegal Aliens", "Aye"],
    [1,  26, "SAVE Act — Voter ID for Federal Elections", "Aye"],
  ];

  const parseVoteMembers = (data) => {
    if (data.houseRollCallVoteMemberVotes && data.houseRollCallVoteMemberVotes.results)
      return data.houseRollCallVoteMemberVotes.results;
    return data.members || data.voteMembers || data.votes || [];
  };

  // Background scoring: fetch multiple key votes and accumulate deltas
  const backgroundScore = async (membersList) => {
    setScoreStatus("Fetching live vote data…");

    // Accumulate deltas per member bioguideId
    const deltas = {};
    const scored = new Set();
    let votesLoaded = 0;

    for (const [session, roll, label, conservativeVote] of KEY_VOTES) {
      try {
        const resp = await fetch(`${FUNCTION_URL}/house-vote/119/${session}/${roll}/members`);
        if (!resp.ok) continue;
        const data = await resp.json();
        const voteMembers = parseVoteMembers(data);
        if (voteMembers.length === 0) continue;

        votesLoaded++;
        setScoreStatus(`Loaded ${votesLoaded} key votes…`);

        for (const v of voteMembers) {
          const vId = (v.bioguideId || v.bioguideID || v.bioguide_id || "").toLowerCase();
          if (!vId) continue;
          const party = v.voteParty || "";
          if (party !== "R") continue; // only score Republicans

          const vote = (v.voteCast || "").trim();
          const isConservative = vote === conservativeVote;
          const isOpposite = (conservativeVote === "Aye" && vote === "No") ||
                             (conservativeVote === "No" && vote === "Aye");

          if (!deltas[vId]) deltas[vId] = 0;
          if (isConservative) deltas[vId] += 6;
          else if (isOpposite) deltas[vId] -= 10;
          else if (vote === "Not Voting" || vote === "Present") deltas[vId] -= 3;

          scored.add(vId);
        }
      } catch(e) {
        console.error(`Vote ${roll} error:`, e);
      }
    }

    if (votesLoaded === 0) {
      setScoreStatus("Live scoring unavailable");
      return;
    }

    setScoreStatus(`Applying scores from ${votesLoaded} votes…`);

    setMembers(prev => {
      return prev.map(m => {
        if (m.party !== "R") return m;
        const mId = (m.bioguideId || "").toLowerCase();
        if (!deltas.hasOwnProperty(mId)) return m;
        const newScore = Math.max(0, Math.min(100, 72 + deltas[mId]));
        return { ...m, alignment: newScore, liveScored: true };
      });
    });

    setScoreStatus(`Live scores applied — ${scored.size} members scored across ${votesLoaded} votes ✓`);
  };

  useEffect(() => {
    loadMembers().then(membersList => {
      if (membersList.length > 0) {
        backgroundScore(membersList);
      }
    });
  }, []);

  // Derived stats
  const republicans = members.filter(m => m.party === "R");
  const gopAvg = republicans.length
    ? Math.round(republicans.reduce((a, m) => a + (m.alignment ?? 72), 0) / republicans.length)
    : 0;
  const liveCount = members.filter(m => m.liveScored).length;
  const heroes = republicans.filter(m => (m.alignment ?? 0) >= 80).length;
  const halfasses = republicans.filter(m => (m.alignment ?? 100) < 50).length;

  const TABS = [
    { id: "tracker", label: "Tracker" },
    { id: "half-asses", label: "Half-Asses (RINOs)" },
    { id: "heroes", label: "Heroes" },
    { id: "my-reps", label: "My Reps" },
    { id: "analysis", label: "AI Analysis" },
    { id: "key-votes", label: "Key Votes" },
    { id: "obstructors", label: "Obstructors" },
    { id: "scotus", label: "Supreme Court" },
    { id: "doge", label: "DOGE Report" },
    { id: "guvnas", label: "Governors" },
    { id: "media", label: "Media Scorecard" },
  ];

  return (
    <div>
      {/* HEADER */}
      <header className="site-header">
        <div className="header-inner">
          <a href="/" style={{textDecoration:'none',color:'inherit',cursor:'pointer'}}>
          <div className="logo-block">
            <div className="logo-mark">RR</div>
            <div className="logo-text">
              <div className="logo-title">RINO REPORT</div>
              <div className="logo-sub">Congressional Intelligence · 119th Congress</div>
            </div>
          </div>
          </a>
          <div className="header-stats">
            <div className="hstat">
              <div className="hstat-val red">{members.length}</div>
              <div className="hstat-label">Tracked</div>
            </div>
            <div className="header-divider"></div>
            <div className="hstat">
              <div className="hstat-val gold">{gopAvg}</div>
              <div className="hstat-label">GOP Avg</div>
            </div>
            <div className="header-divider"></div>
            <div className="hstat">
              <div className="hstat-val blue">{liveCount}</div>
              <div className="hstat-label">Live Scored</div>
            </div>
            <div className="header-divider"></div>
            {liveCount > 0
              ? <div className="live-badge"><div className="live-dot"></div>LIVE DATA</div>
              : <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--text-muted)"}}>{scoreStatus}</div>
            }
          </div>
        </div>
      </header>

      {/* SUPPORT BAR */}
      <div className="support-bar">
        <span className="support-bar-text">Support independent accountability journalism —</span>
        <a href={STRIPE_MONTHLY} target="_blank" rel="noopener noreferrer" className="support-btn monthly">
          Support $3/mo
        </a>
        <a href={STRIPE_ONETIME} target="_blank" rel="noopener noreferrer" className="support-btn onetime">
          One-time $5
        </a>
      </div>

      {loading ? (
        <div className="loading-wrap">
          <div className="loading-spinner"></div>
          <div className="loading-text">{loadStatus}</div>
        </div>
      ) : (
        <>
          {/* STAT BOXES */}
          <div className="stat-row">
            <div className="stat-box red">
              <div className="stat-box-icon">👥</div>
              <div className="stat-box-val">{members.length}</div>
              <div className="stat-box-label">Members Tracked</div>
            </div>
            <div className="stat-box blue">
              <div className="stat-box-icon">⚡</div>
              <div className="stat-box-val">{liveCount}</div>
              <div className="stat-box-label">Live Scored</div>
            </div>
            <div className="stat-box green">
              <div className="stat-box-icon">✓</div>
              <div className="stat-box-val">{heroes}</div>
              <div className="stat-box-label">Loyal (80+)</div>
            </div>
            <div className="stat-box gold">
              <div className="stat-box-icon">⚠</div>
              <div className="stat-box-val">{halfasses}</div>
              <div className="stat-box-label">Disloyal (&lt;50)</div>
            </div>
          </div>

          {/* TABS */}
          <div className="tabs-wrap">
            <div className="tabs">
              {TABS.map(t => (
                <button
                  key={t.id}
                  className={`tab ${tab === t.id ? "active" : ""}`}
                  onClick={() => setTab(t.id)}
                >{t.label}</button>
              ))}
            </div>
          </div>

          {/* TAB CONTENT */}
          <div className="main">
            {tab === "tracker" && <TrackerTab members={members} onSelect={setSelectedMember} />}
            {tab === "half-asses" && <HalfAssesTab members={members} onSelect={setSelectedMember} />}
            {tab === "heroes" && <HeroesTab members={members} onSelect={setSelectedMember} />}
            {tab === "my-reps" && <MyRepsTab members={members} onSelect={setSelectedMember} />}
            {tab === "analysis" && <AnalysisTab members={members} />}
            {tab === "guvnas" && <GuvnasTab onSelect={g => setSelectedMember({...g, alignment: g.score, chamber:"Governor", bioguideId: g.state})} />}
            {tab === "media" && <MediaTab />}
            {tab === "key-votes" && <KeyVotesTab />}
            {tab === "obstructors" && <ObstructorsTab members={members} onSelect={setSelectedMember} />}
            {tab === "scotus" && <ScotusTab />}
            {tab === "doge" && <DogeTab members={members} />}
          </div>
        </>
      )}

      {/* CONTACT MODAL */}
      {selectedMember && (
        <ContactModal member={selectedMember} onClose={() => setSelectedMember(null)} />
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
